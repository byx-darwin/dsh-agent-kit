<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d">
  <title id="t">dsh-agent-kit 架构</title>
  <desc id="d">业务包通过 inject 使用 dsh-agent-kit 的四个 Service；dsh-agent-kit 运行在 dsh 之上，并连接业务系统、钉钉、Claude Code / Codex 与 TypeSafe API。</desc>
  <style>
    .serif { font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 700; }
    .sans { font-family: 'Noto Sans SC', -apple-system, 'PingFang SC', sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }
  </style>
  <rect width="960" height="560" fill="#FAF7F0"/>

  <!-- 外部系统：与 dsh-agent-kit 框纵向对齐，水平短线连接 -->
  <text x="40" y="160" class="sans" font-size="12" letter-spacing="2" fill="#B4532A">外部系统</text>
  <g class="sans" font-size="13" fill="#2A2622">
    <rect x="40" y="176" width="220" height="40" rx="6" fill="#FFFFFF" stroke="#E3DCCD"/>
    <text x="54" y="201">业务系统 · WebSocket</text><text x="248" y="201" text-anchor="end" fill="#B4532A" font-size="12">壹</text>
    <rect x="40" y="224" width="220" height="40" rx="6" fill="#FFFFFF" stroke="#E3DCCD"/>
    <text x="54" y="249">钉钉 · 经 dws CLI</text><text x="248" y="249" text-anchor="end" fill="#B4532A" font-size="12">贰</text>
    <rect x="40" y="272" width="220" height="40" rx="6" fill="#FFFFFF" stroke="#E3DCCD"/>
    <text x="54" y="297">Claude Code / Codex</text><text x="248" y="297" text-anchor="end" fill="#B4532A" font-size="12">叁</text>
    <rect x="40" y="320" width="220" height="40" rx="6" fill="#FFFFFF" stroke="#E3DCCD"/>
    <text x="54" y="345">TypeSafe API</text><text x="248" y="345" text-anchor="end" fill="#B4532A" font-size="12">肆</text>
  </g>
  <g stroke="#B4532A" stroke-width="1.2">
    <line x1="260" y1="196" x2="300" y2="196"/>
    <line x1="260" y1="244" x2="300" y2="244"/>
    <line x1="260" y1="292" x2="300" y2="292"/>
    <line x1="260" y1="340" x2="300" y2="340"/>
  </g>

  <!-- 业务包 -->
  <rect x="300" y="40" width="620" height="84" rx="8" fill="#F1EBDF"/>
  <text x="324" y="72" class="serif" font-size="18" fill="#2A2622">你的业务包</text>
  <text x="324" y="100" class="sans" font-size="13" fill="#4D463E">协议、路由、模板、流程 · 只 inject 用到的 Service</text>
  <text x="620" y="150" class="mono" font-size="12" fill="#6B6258">inject</text>
  <line x1="610" y1="124" x2="610" y2="168" stroke="#2A2622" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- dsh-agent-kit -->
  <rect x="300" y="170" width="620" height="200" rx="8" fill="#FFFFFF" stroke="#2A2622" stroke-width="1.5"/>
  <text x="324" y="202" class="serif" font-size="18" fill="#2A2622">@mc/dsh-agent-kit</text>
  <text x="560" y="202" class="sans" font-size="12" fill="#6B6258">四个 Service 默认禁用，按需启用</text>
  <g class="sans">
    <rect x="324" y="220" width="136" height="80" rx="6" fill="#F1EBDF"/>
    <text x="338" y="244" class="serif" font-size="13" fill="#B4532A">壹 · 连接</text>
    <text x="338" y="268" class="mono" font-size="13" fill="#2A2622">agentWs</text>
    <rect x="472" y="220" width="136" height="80" rx="6" fill="#F1EBDF"/>
    <text x="486" y="244" class="serif" font-size="13" fill="#B4532A">贰 · 推送</text>
    <text x="486" y="268" class="mono" font-size="13" fill="#2A2622">dingtalk</text>
    <rect x="620" y="220" width="136" height="80" rx="6" fill="#F1EBDF"/>
    <text x="634" y="244" class="serif" font-size="13" fill="#B4532A">叁 · 委托</text>
    <text x="634" y="268" class="mono" font-size="13" fill="#2A2622">agentTasks</text>
    <rect x="768" y="220" width="136" height="80" rx="6" fill="#F1EBDF"/>
    <text x="782" y="244" class="serif" font-size="13" fill="#B4532A">肆 · 校验</text>
    <text x="782" y="268" class="mono" font-size="13" fill="#2A2622">jev</text>
  </g>
  <rect x="324" y="314" width="580" height="40" rx="6" fill="none" stroke="#E3DCCD" stroke-dasharray="4 3"/>
  <text x="340" y="339" class="sans" font-size="12" fill="#4D463E">常驻行 agent-kit：AgentKitAdmin 服务 + dsh Web「设置 → Agent Kit」页 · 命令行 doctor / setup</text>

  <!-- dsh -->
  <line x1="610" y1="370" x2="610" y2="412" stroke="#2A2622" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="300" y="414" width="620" height="106" rx="8" fill="#2A2622"/>
  <text x="324" y="446" class="serif" font-size="18" fill="#FAF7F0">dsh（DeepSeek Harness）</text>
  <text x="324" y="474" class="sans" font-size="13" fill="#E3DCCD">cordis loader · Profile patch 层 · subagents · subprocess · credentials · webServer</text>
  <text x="324" y="500" class="sans" font-size="12" fill="#C9BCA8">Profile 的 cordis.patch.yml 决定启用哪些 Service 与配置</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2A2622"/>
    </marker>
  </defs>
</svg>
