<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d">
  <title id="t">dsh-agent-kit 架构</title>
  <desc id="d">业务包通过 inject 使用 dsh-agent-kit 的六个 Service；dsh-agent-kit 运行在 dsh 之上，并连接业务系统、钉钉、飞书、Claude Code / Codex 与 TypeSafe API；通知渠道不直连外部系统，转发给钉钉或飞书。</desc>
  <style>
    .serif { font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 700; }
    .sans { font-family: 'Noto Sans SC', -apple-system, 'PingFang SC', sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }
  </style>
  <rect width="960" height="560" fill="#FAF7F0"/>

  <!-- 外部系统：与 dsh-agent-kit 框纵向对齐，水平短线连接；通知渠道（肆）不直连外部系统，转发给钉钉或飞书 -->
  <text x="40" y="160" class="sans" font-size="12" letter-spacing="2" fill="#B4532A">外部系统</text>
  <g class="sans" font-size="13" fill="#2A2622">
    <rect x="40" y="176" width="220" height="34" rx="6" fill="#FFFFFF" stroke="#E3DCCD"/>
    <text x="54" y="198">业务系统 · WebSocket</text><text x="248" y="198" text-anchor="end" fill="#B4532A" font-size="12">壹</text>
    <rect x="40" y="216" width="220" height="34" rx="6" fill="#FFFFFF" stroke="#E3DCCD"/>
    <text x="54" y="238">钉钉 · 经 dws CLI</text><text x="248" y="238" text-anchor="end" fill="#B4532A" font-size="12">贰</text>
    <rect x="40" y="256" width="220" height="34" rx="6" fill="#FFFFFF" stroke="#E3DCCD"/>
    <text x="54" y="278">飞书 · 经 lark-cli</text><text x="248" y="278" text-anchor="end" fill="#B4532A" font-size="12">叁</text>
    <rect x="40" y="296" width="220" height="34" rx="6" fill="#FFFFFF" stroke="#E3DCCD"/>
    <text x="54" y="318">Claude Code / Codex</text><text x="248" y="318" text-anchor="end" fill="#B4532A" font-size="12">伍</text>
    <rect x="40" y="336" width="220" height="34" rx="6" fill="#FFFFFF" stroke="#E3DCCD"/>
    <text x="54" y="358">TypeSafe API</text><text x="248" y="358" text-anchor="end" fill="#B4532A" font-size="12">陆</text>
  </g>
  <g stroke="#B4532A" stroke-width="1.2">
    <line x1="260" y1="193" x2="300" y2="193"/>
    <line x1="260" y1="233" x2="300" y2="233"/>
    <line x1="260" y1="273" x2="300" y2="273"/>
    <line x1="260" y1="313" x2="300" y2="313"/>
    <line x1="260" y1="353" x2="300" y2="353"/>
  </g>

  <!-- 业务包 -->
  <rect x="300" y="40" width="620" height="84" rx="8" fill="#F1EBDF"/>
  <text x="324" y="72" class="serif" font-size="18" fill="#2A2622">你的业务包</text>
  <text x="324" y="100" class="sans" font-size="13" fill="#4D463E">协议、路由、模板、流程 · 只 inject 用到的 Service</text>
  <text x="620" y="150" class="mono" font-size="12" fill="#6B6258">inject</text>
  <line x1="610" y1="124" x2="610" y2="168" stroke="#2A2622" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- dsh-agent-kit -->
  <rect x="300" y="170" width="620" height="200" rx="8" fill="#FFFFFF" stroke="#2A2622" stroke-width="1.5"/>
  <text x="324" y="202" class="serif" font-size="18" fill="#2A2622">@mc/dsh-agent-kit</text>
  <text x="560" y="202" class="sans" font-size="12" fill="#6B6258">六个 Service 默认禁用，按需启用</text>
  <g class="sans">
    <rect x="324" y="220" width="90" height="80" rx="6" fill="#F1EBDF"/>
    <text x="334" y="244" class="serif" font-size="13" fill="#B4532A">壹 · 连接</text>
    <text x="334" y="268" class="mono" font-size="12" fill="#2A2622">agentWs</text>
    <rect x="422" y="220" width="90" height="80" rx="6" fill="#F1EBDF"/>
    <text x="432" y="244" class="serif" font-size="13" fill="#B4532A">贰 · 推送</text>
    <text x="432" y="268" class="mono" font-size="12" fill="#2A2622">dingtalk</text>
    <rect x="520" y="220" width="90" height="80" rx="6" fill="#F1EBDF"/>
    <text x="530" y="244" class="serif" font-size="13" fill="#B4532A">叁 · 推送</text>
    <text x="530" y="268" class="mono" font-size="12" fill="#2A2622">feishu</text>
    <rect x="618" y="220" width="90" height="80" rx="6" fill="#F1EBDF"/>
    <text x="628" y="244" class="serif" font-size="13" fill="#B4532A">肆 · 通知</text>
    <text x="628" y="268" class="mono" font-size="12" fill="#2A2622">notify</text>
    <text x="628" y="288" font-size="11" fill="#6B6258">转发 贰 / 叁</text>
    <rect x="716" y="220" width="90" height="80" rx="6" fill="#F1EBDF"/>
    <text x="726" y="244" class="serif" font-size="13" fill="#B4532A">伍 · 委托</text>
    <text x="726" y="268" class="mono" font-size="12" fill="#2A2622">agentTasks</text>
    <rect x="814" y="220" width="90" height="80" rx="6" fill="#F1EBDF"/>
    <text x="824" y="244" class="serif" font-size="13" fill="#B4532A">陆 · 校验</text>
    <text x="824" y="268" class="mono" font-size="12" fill="#2A2622">jev</text>
  </g>
  <rect x="324" y="314" width="580" height="40" rx="6" fill="none" stroke="#E3DCCD" stroke-dasharray="4 3"/>
  <text x="340" y="339" class="sans" font-size="12" fill="#4D463E">常驻行 agent-kit：AgentKitAdmin 服务 + dsh Web「设置 → Agent Kit」页 · 命令行 doctor / setup</text>

  <!-- dsh -->
  <line x1="610" y1="370" x2="610" y2="412" stroke="#2A2622" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="300" y="414" width="620" height="106" rx="8" fill="#2A2622"/>
  <text x="324" y="446" class="serif" font-size="18" fill="#FAF7F0">dsh（DeepSeek Harness）</text>
  <text x="324" y="474" class="sans" font-size="13" fill="#E3DCCD">cordis loader · Profile patch 层 · subagents · subprocess · credentials · webServer</text>
  <text x="324" y="500" class="sans" font-size="12" fill="#C9BCA8">Profile 的 cordis.patch.yml 决定启用哪些 Service 与配置</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2A2622"/>
    </marker>
  </defs>
</svg>
